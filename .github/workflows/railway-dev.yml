name: Deploy to Railway Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Validate Railway config
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEV_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_DEV_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_DEV_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_DEV_SERVICE }}
        run: |
          missing=0

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing required GitHub secret: RAILWAY_DEV_TOKEN"
            missing=1
          fi

          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "Missing required GitHub variable: RAILWAY_DEV_PROJECT_ID"
            missing=1
          fi

          if [ -z "$RAILWAY_ENVIRONMENT" ]; then
            echo "Missing required GitHub variable: RAILWAY_DEV_ENVIRONMENT"
            missing=1
          fi

          if [ -z "$RAILWAY_SERVICE" ]; then
            echo "Missing required GitHub variable: RAILWAY_DEV_SERVICE"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi

      - name: Deploy to Railway Dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEV_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_DEV_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_DEV_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_DEV_SERVICE }}
        run: |
          if ! railway service status --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" >/tmp/railway-target-check.log 2>&1; then
            echo "Railway deploy target is invalid for this environment."
            echo "Service: $RAILWAY_SERVICE"
            echo "Environment: $RAILWAY_ENVIRONMENT"
            echo "Project: $RAILWAY_PROJECT_ID"
            echo "Tip: In Railway dashboard, open the target environment and use Sync to import this service."
            cat /tmp/railway-target-check.log
            exit 1
          fi

          max_attempts=5
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt ${attempt}/${max_attempts}"
            if railway up --ci --verbose --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID"; then
              echo "Deployment succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 15))
              echo "Deployment failed. Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
            fi

            attempt=$((attempt + 1))
          done

          echo "Deployment failed after ${max_attempts} attempts."
          exit 1

      - name: Verify Multiplayer Server Runtime
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_DEV_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_DEV_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_DEV_ENVIRONMENT }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_DEV_SERVICE }}
        run: |
          set -euo pipefail

          service_url="$(railway domain --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --project "$RAILWAY_PROJECT_ID" | tr -d '\r' | tail -n 1 | xargs)"
          if [ -z "$service_url" ]; then
            echo "Could not determine Railway service domain."
            exit 1
          fi

          case "$service_url" in
            http://*|https://*) health_url="${service_url%/}/healthz" ;;
            *) health_url="https://${service_url%/}/healthz" ;;
          esac

          echo "Checking health at $health_url"

          max_attempts=10
          attempt=1

          while [ "$attempt" -le "$max_attempts" ]; do
            response="$(curl --silent --show-error --location --max-time 10 "$health_url" || true)"
            echo "$response"

            if echo "$response" | grep -q '"ok"[[:space:]]*:[[:space:]]*true'; then
              echo "Health check passed."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Service not healthy yet (attempt ${attempt}/${max_attempts}). Retrying in 10s..."
              sleep 10
            fi

            attempt=$((attempt + 1))
          done

          echo "Service did not become healthy at $health_url after ${max_attempts} attempts."
          exit 1
